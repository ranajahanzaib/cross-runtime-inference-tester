[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "cross-runtime-inference-tester"
version = "0.1.0"
description = "Measure ML inference correctness and performance across runtimes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "skl2onnx>=1.17,<2",
  "onnx>=1.17,<2",
  "onnxruntime>=1.20,<2",
  "typer>=0.12,<1",
  "pydantic>=2.9,<3",
  "jsonschema>=4.23,<5",
  "rich>=13.9,<15",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[project.scripts]
cross-runtime-inference-tester = "cross_runtime_inference_tester.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["python/cross_runtime_inference_tester"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["python/cross_runtime_inference_tester"]
ignore_missing_imports = true
