name: Build static dashboard for Cloudflare Pages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with: { version: 12.3.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - run: uv run --project . cross-runtime-inference-tester demo
      - run: pnpm build
      # Upload dist/ with the Cloudflare Pages dashboard or Wrangler after configuring account credentials.
