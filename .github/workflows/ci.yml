name: Cross Runtime Inference Tester CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: uv sync --locked --extra dev
      - run: pnpm install --frozen-lockfile
      - run: uv run ruff check python
      - run: uv run mypy
      - run: uv run pytest
      - run: pnpm --dir apps/web typecheck
      - run: pnpm --dir apps/web test
      - run: uv run --project . cross-runtime-inference-tester demo
      - run: uv run --project . cross-runtime-inference-tester verify
      - run: pnpm build
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: pnpm --dir apps/web exec playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-runtime-inference-tester-reports
          path: artifacts/reports
